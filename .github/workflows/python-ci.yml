name: Python CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify assignment pack
        run: python tools/check_pack.py

      - name: Run test suite
        run: pytest -q

      - name: Regenerate data-driven reports
        run: python tools/regenerate_artifacts.py

      - name: Upload generated analytical artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kasparro-analysis-artifacts
          path: |
            evaluation/results/final_report.json
            evaluation/results/prompt_scores.json
            evaluation/results/report.html
            evaluation/results/eval_results.json
            evaluation/results/eval_comparison_report.md
            evaluation/results/eval_held_out_results.json
            evaluation/results/eval_comparison_report_held_out.md
          if-no-files-found: error

      - name: Check whitespace errors
        run: git diff --check
