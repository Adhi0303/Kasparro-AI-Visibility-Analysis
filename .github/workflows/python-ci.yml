name: Python CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify assignment pack
        run: python tools/check_pack.py

      - name: Run test suite
        run: pytest -q

      - name: Run deterministic evaluation
        run: python -m evaluation.run_eval --mode replay

      - name: Check whitespace errors
        run: git diff --check
